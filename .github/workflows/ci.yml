name: CI

# Run on every push and pull request; no branch filter, so renaming the default branch
# cannot silently disable CI.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the bundled web workbench
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install dependencies (including the optional image extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[image,test]"

      # The textual-image marker in pyproject.toml is python_version >= "3.12", so pip
      # excludes it on 3.10 / 3.11. That is expected and is not an install failure;
      # printing the status makes it obvious why the real-image tests are skipped.
      - name: Show real-image dependency status
        run: |
          python -m pip show textual-image \
            || echo "textual-image not installed (Python < 3.12, excluded by the pyproject marker - expected)"

      - name: Run tests
        run: python -m pytest -q

      # Charts label axes and titles in Chinese. Without any CJK font matplotlib falls back
      # to a narrower one and the glyphs render as boxes; the runner image has none, so
      # install a real one here. The *no-font* path is covered on purpose by
      # tests/test_imgcharts.py::test_charts_survive_without_cjk_font.
      - name: Install CJK fonts for chart labels
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      # The built-in pricing table ships inside the package. A packaging regression here
      # would silently price everything at $0 for users without their own pricing file,
      # so build the wheel once and assert the data file is inside it.
      - name: Verify the wheel ships pricing and the self-contained web bundle
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python -c "import glob,sys,zipfile; \
          w=glob.glob('dist/*.whl')[0]; \
          names=zipfile.ZipFile(w).namelist(); \
          hit=[n for n in names if n.endswith('codex_usage/data/pricing.json')]; \
          web=[n for n in names if n.startswith('codex_usage/web_static/')]; \
          required=['codex_usage/data/pricing.json','codex_usage/web_static/index.html']; \
          missing=[n for n in required if n not in names]; \
          sys.exit('wheel missing ' + str(missing)) if missing else print('wheel ships pricing and',len(web),'web assets'); \
          assert any(n.endswith('.js') for n in web), 'web JavaScript missing'; \
          assert any(n.endswith('.css') for n in web), 'web CSS missing'"

  ruff:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      - name: "ruff check (config: ruff.toml)"
        run: ruff check .

  mypy:
    name: mypy src
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mypy
        run: python -m pip install mypy

      - name: "mypy src (config: mypy.ini)"
        run: mypy src
